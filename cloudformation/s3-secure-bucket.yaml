AWSTemplateFormatVersion: "2010-09-09"
Description: "Secure S3 bucket configuration for DropBox application with block public access settings"

Parameters:
  BucketName:
    Type: String
    Default: "dropbox-secure-storage"
    Description: "Name of the S3 bucket for DropBox storage"
    
  Environment:
    Type: String
    Default: "production"
    Description: "Environment name"
    AllowedValues:
      - development
      - staging
      - production

Resources:
  # S3 Bucket with secure configuration
  DropBoxS3Bucket:
    Type: "AWS::S3::Bucket"
    Properties:
      BucketName: !Ref BucketName
      
      # Block all public access - CRITICAL SECURITY SETTING
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      
      # Enable versioning for data protection
      VersioningConfiguration:
        Status: Enabled
        
      # Server-side encryption
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
            BucketKeyEnabled: true
            
      # Lifecycle configuration for cost optimization
      LifecycleConfiguration:
        Rules:
          - Id: "DeleteIncompleteMultipartUploads"
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
              
      # Notification configuration (optional)
      NotificationConfiguration:
        CloudWatchConfigurations: []
        
      Tags:
        - Key: "Name"
          Value: "DropBox Storage"
        - Key: "Environment"  
          Value: !Ref Environment
        - Key: "Security"
          Value: "BlockPublicAccess"

Outputs:
  BucketName:
    Description: "Name of the created S3 bucket"
    Value: !Ref DropBoxS3Bucket
    Export:
      Name: !Sub "${AWS::StackName}-BucketName"
      
  BucketArn:
    Description: "ARN of the created S3 bucket"
    Value: !GetAtt DropBoxS3Bucket.Arn
    Export:
      Name: !Sub "${AWS::StackName}-BucketArn"
      
  BucketDomainName:
    Description: "Domain name of the S3 bucket"
    Value: !GetAtt DropBoxS3Bucket.DomainName
    Export:
      Name: !Sub "${AWS::StackName}-BucketDomainName"
      
  PublicAccessBlockStatus:
    Description: "Confirmation that public access is blocked"
    Value: "All public access settings are enabled (Block Public ACLs, Ignore Public ACLs, Block Public Policy, Restrict Public Buckets)"