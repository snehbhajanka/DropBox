
# DropBox Application Configuration

# Server Configuration
server.port=8080
server.servlet.context-path=/api

# AWS S3 Configuration (for production deployment)
# These values should be set via environment variables in production
aws.region=us-east-2
aws.s3.bucket-name=${AWS_S3_BUCKET_NAME:dropbox-storage-dev}

# File Upload Configuration
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Security Configuration
spring.security.enabled=false

# Logging Configuration
logging.level.com.dropbox.application=INFO
logging.level.software.amazon.awssdk=WARN
