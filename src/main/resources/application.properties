# AWS S3 Configuration
aws.s3.bucket-name=${AWS_S3_BUCKET_NAME:secure-dropbox-storage}
aws.s3.region=${AWS_REGION:us-east-2}
aws.s3.access-key=${AWS_ACCESS_KEY_ID:}
aws.s3.secret-key=${AWS_SECRET_ACCESS_KEY:}

# Server configuration
server.max-http-header-size=64KB
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
