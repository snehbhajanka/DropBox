# AWS S3 Configuration
aws.s3.bucket-name=${AWS_S3_BUCKET_NAME:dropbox-storage-bucket}
aws.s3.region=${AWS_REGION:us-east-1}

# Security settings - Ensure these are never exposed publicly
aws.s3.access-key=${AWS_ACCESS_KEY_ID:}
aws.s3.secret-key=${AWS_SECRET_ACCESS_KEY:}

# Application settings
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Storage configuration
dropbox.storage.type=${STORAGE_TYPE:memory}
# Options: memory, s3