# AWS Configuration
aws.region=us-east-1
aws.s3.bucket.name=dropbox-secure-storage

# S3 Security Configuration - CRITICAL SETTINGS
aws.s3.security.block-public-acls=true
aws.s3.security.ignore-public-acls=true
aws.s3.security.block-public-policy=true
aws.s3.security.restrict-public-buckets=true

# Application Configuration
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB