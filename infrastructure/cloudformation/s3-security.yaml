AWSTemplateFormatVersion: "2010-09-09"
Description: "S3 Bucket Security Configuration - Remediation for S3.3 Misconfiguration"

Parameters:
  Environment:
    Type: String
    Default: "prod"
    AllowedValues: 
      - "dev"
      - "staging"
      - "prod"
    Description: "Environment for the S3 buckets"

Resources:
  # S3 Bucket 1: Primary Storage
  DropBoxStorageBucket1:
    Type: "AWS::S3::Bucket"
    Properties:
      BucketName: "dropbox-app-storage-bucket-1"
      AccessControl: "Private"
      VersioningConfiguration:
        Status: "Enabled"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: "AES256"
            BucketKeyEnabled: true
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      Tags:
        - Key: "Name"
          Value: "dropbox-app-storage-bucket-1"
        - Key: "Environment"
          Value: !Ref Environment
        - Key: "Purpose"
          Value: "DropBox Application Storage"
        - Key: "Security"
          Value: "Hardened"
        - Key: "Compliance"
          Value: "S3.3-Remediated"

  # S3 Bucket 2: Secondary Storage
