Outputs:
  SecureBucketNames:
    Description: "Names of all secured S3 buckets"
    Value: !Join 
      - ","
      - - !Ref DropBoxStorageBucket1
        - !Ref DropBoxStorageBucket2
        - !Ref DropBoxStorageBucket3
        - !Ref DropBoxBackupBucket1
        - !Ref DropBoxBackupBucket2
        - !Ref DropBoxLogsBucket1
        - !Ref DropBoxLogsBucket2
        - !Ref DropBoxTempBucket1
        - !Ref DropBoxTempBucket2
        - !Ref DropBoxUploadsBucket1
        - !Ref DropBoxUploadsBucket2
        - !Ref DropBoxConfigBucket1
        - !Ref DropBoxArchiveBucket1

  SecurityCompliance:
    Description: "Security compliance status"
    Value: "All 13 buckets configured with S3.3 remediation - Public access blocked"

  BucketCount:
    Description: "Number of secured buckets"
    Value: "13"